<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our AI Broker</title>
  <style>
    :root {
      --bg-color: #343541;
      --chat-bg: #444654;
      --input-bg: #40414f;
      --text-color: #ececf1;
      --accent-color: #10a37f;
      --border-color: #565869;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    header {
      padding: 1rem;
      text-align: center;
      background-color: #202123;
      font-size: 1.25rem;
      font-weight: 600;
      border-bottom: 1px solid var(--border-color);
    }

    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .message {
      display: flex;
      gap: 0.75rem;
      max-width: 800px;
      margin: 0 auto;
      width: 100%;
      padding: 1rem;
      border-radius: 0.5rem;
      line-height: 1.5;
      word-break: break-word;
    }

    .message.user {
      background-color: var(--bg-color);
    }

    .message.assistant {
      background-color: var(--chat-bg);
    }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 0.85rem;
      flex-shrink: 0;
    }

    .user .avatar {
      background-color: #5436da;
    }

    .assistant .avatar {
      background-color: var(--accent-color);
    }

    .content {
      flex: 1;
      white-space: pre-wrap;
    }

    .error-msg {
      color: #ff6b6b;
    }

    #input-container {
      padding: 1rem;
      background-color: var(--bg-color);
      border-top: 1px solid var(--border-color);
    }

    form {
      max-width: 800px;
      margin: 0 auto;
      display: flex;
      gap: 0.5rem;
      position: relative;
    }

    textarea {
      width: 100%;
      background-color: var(--input-bg);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      border-radius: 0.5rem;
      padding: 0.75rem 3rem 0.75rem 0.75rem;
      font-size: 1rem;
      resize: none;
      height: 52px;
      outline: none;
    }

    textarea:focus {
      border-color: var(--accent-color);
    }

    button {
      position: absolute;
      right: 8px;
      bottom: 8px;
      background-color: var(--accent-color);
      color: white;
      border: none;
      border-radius: 0.375rem;
      padding: 0.4rem 0.75rem;
      cursor: pointer;
      font-weight: 600;
    }

    button:disabled {
      background-color: var(--border-color);
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <header>Our AI Broker</header>

  <div id="chat-container">
    <div class="message assistant">
      <div class="avatar">AI</div>
      <div class="content">Hello! Connected to OpenCode & Ox Alpha. How can I help you today?</div>
    </div>
  </div>

  <div id="input-container">
    <form id="chat-form">
      <textarea id="prompt-input" placeholder="Send a message..." required></textarea>
      <button type="submit" id="send-btn">Send</button>
    </form>
  </div>

  <script>
    const chatContainer = document.getElementById('chat-container');
    const chatForm = document.getElementById('chat-form');
    const promptInput = document.getElementById('prompt-input');
    const sendBtn = document.getElementById('send-btn');

    function appendMessage(role, text, isError = false) {
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${role}`;

      const avatar = document.createElement('div');
      avatar.className = 'avatar';
      avatar.textContent = role === 'user' ? 'You' : 'AI';

      const content = document.createElement('div');
      content.className = `content ${isError ? 'error-msg' : ''}`;
      content.textContent = text;

      msgDiv.appendChild(avatar);
      msgDiv.appendChild(content);
      chatContainer.appendChild(msgDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;
      return content;
    }

    promptInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        chatForm.dispatchEvent(new Event('submit'));
      }
    });

    chatForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const promptText = promptInput.value.trim();
      if (!promptText) return;

      appendMessage('user', promptText);
      promptInput.value = '';
      promptInput.disabled = true;
      sendBtn.disabled = true;

      const loadingContent = appendMessage('assistant', 'Thinking...');

      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: promptText })
        });

        const data = await response.json();

        if (response.ok && data.response) {
          loadingContent.textContent = data.response;
        } else {
          loadingContent.classList.add('error-msg');
          loadingContent.textContent = data.response || `Server Error (${response.status})`;
        }
      } catch (err) {
        loadingContent.classList.add('error-msg');
        loadingContent.textContent = `Network Error: ${err.message}`;
      } finally {
        promptInput.disabled = false;
        sendBtn.disabled = false;
        promptInput.focus();
        chatContainer.scrollTop = chatContainer.scrollHeight;
      }
    });
  </script>
</body>
</html>
